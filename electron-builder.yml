# electron-builder 配置：Windows NSIS 安装包
# 要点：
#   - files 只含 electron/** 与 package.json（无运行时依赖，server.cjs 全自包含）
#   - extraResources 把 dist/ 复制到 resources/dist（绕开 asar 内 Express 流式服务坑）
#   - 未打包态（electron:dev）不经过此配置

appId: com.starpuff.game
productName: StarPuff
# better-sqlite3 为 N-API 预编译模块（v13+），跨 Electron 版本 ABI 稳定，无需 node-gyp 重编译；
# 禁用 rebuild 可避免本机缺少 Visual Studio 导致打包失败
npmRebuild: false
directories:
  buildResources: build
  output: release
files:
  - electron/**
  - package.json
  - "node_modules/steamworks.js/**/*"
  - "node_modules/better-sqlite3/**/*"
  - "node_modules/bindings/**/*"
  - "node_modules/file-uri-to-path/**/*"
# 原生 .node 模块必须解包到真实文件系统（asar 内 dlopen 会失败）
# steamworks.js、better-sqlite3 都是 native 模块，bindings 是 better-sqlite3 的依赖
asarUnpack:
  - "node_modules/steamworks.js/**/*"
  - "node_modules/better-sqlite3/**/*"
  - "node_modules/bindings/**/*"
extraResources:
  - from: dist
    to: dist
    filter:
      - "**/*"
win:
  icon: build/icon.ico
  # 免签名打包：不配置证书则无需下载 winCodeSign，避免中国大陆网络下从 GitHub 下载卡住
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  executableName: StarPuff
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: "喵汪星云 StarPuff"
  createDesktopShortcut: always
  artifactName: ${productName}-Setup-${version}.${ext}
